<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillpoint web stabilizer</title>
<meta name="description" content="The Stillpoint browser stabilizer is launching shortly.">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f5f5f7'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%230b0c0e'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#f5f5f7;--ink2:rgba(235,235,245,.75)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b0c0e;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  isolation:isolate;position:relative;overflow:hidden;padding:24px}
.bg{position:fixed;inset:-40px;z-index:-2;background:url(../media/still_0025.jpg) center/cover;filter:blur(6px) brightness(.62) saturate(1.1);transform:scale(1.04)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 50%,rgba(8,9,11,.25),rgba(8,9,11,.85))}
.card{max-width:620px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--ink);margin:0 auto 26px;position:relative}
.dot::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#0b0c0e}
h1{font-size:clamp(36px,6vw,60px);letter-spacing:-.025em;line-height:1.05;margin:0}
p{font-size:clamp(17px,2vw,20px);color:var(--ink2);line-height:1.5;margin:20px 0 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
a.btn{display:inline-flex;align-items:center;height:50px;padding:0 24px;border-radius:999px;font-weight:600;text-decoration:none;font-size:16px}
a.p{background:var(--ink);color:#0b0c0e}
a.g{background:rgba(255,255,255,.14);color:var(--ink);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="dot"></div>
  <h1>The web stabilizer is launching shortly.</h1>
  <p>Stillpoint's browser version is in its final checks. It runs entirely on your own computer with WebCodecs and WebGPU, so your footage is never uploaded. Check back soon, or follow along on GitHub.</p>
  <div class="row">
    <a class="btn p" href="https://github.com/jbittlest/stillpoint">github.com/jbittlest/stillpoint</a>
    <a class="btn g" href="../">Back to Stillpoint</a>
  </div>
</div>
</body>
</html>
